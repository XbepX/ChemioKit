# Glossário de nomes do ChemioKit (copiado do ChemioChat_app em 2026-11-21)
#
# Liga os nomes que estudantes e professores usam (oficiais, comuns, comerciais e
# informais) a uma estrutura (SMILES). É consultado ANTES do PubChem.
# Veja glossario/LEIAME.md para saber como acrescentar entradas.
#
# Campos de [[substancia]]:
#   id          identificador único, sem acento nem espaço
#   nome        nome exibido ao estudante
#   smiles      estrutura (conferida pelo RDKit quando o app abre)
#   iupac       nomes sistemáticos (IUPAC) em português
#   comuns      nomes usuais ou tradicionais
#   comerciais  marcas e nomes comerciais
#   informais   nomes populares ou do dia a dia
#   ingles      nomes em inglês (também usados na busca)
#   nota        observação mostrada ao usuário (opcional)
#
# Campos de [[mistura]]: id, nome, os mesmos campos de nomes, nota e
#   componentes  lista de ids de substâncias
#   principal    id do componente mais relevante (opcional)
#
# Um mesmo nome pode aparecer em mais de uma entrada de propósito (ex.: "ácido
# tartárico"). Nesse caso o ChemioKit mostra as opções e pergunta qual é.

