[project]
name = "chemiokit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2",
    "pandas<3",
    "rdkit",
    "streamlit",
    "pubchempy>=1.0.5",
    "py3dmol>=2.5.4",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
